<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f4f4f4; }
        .container { margin-top: 50px; }
        textarea { width: 60%; height: 100px; padding: 10px; }
        button { padding: 10px 20px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; font-size: 22px; font-weight: bold; }
        nav a { margin: 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/live">Live News</a>
    <a href="/about">About</a>
</nav>

<div class="container">
    <h1>Fake News Detection System</h1>
    <form method="POST">
        <textarea name="news" placeholder="Enter news text here..." required></textarea><br><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">
            Prediction: {{ prediction }}
        </div>
    {% endif %}
</div>

</body>
</html>
